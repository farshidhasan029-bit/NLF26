<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <path d="M 100 20 L 165 45 C 165 115 135 155 100 180 C 65 155 35 115 35 45 Z" fill="url(#shieldGrad)" stroke="url(#accentGold)" stroke-width="3" />
  
  <!-- Inner Shield Trim -->
  <path d="M 100 30 L 153 52 C 153 110 128 144 100 166 C 72 144 47 110 47 52 Z" fill="#03261d" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Speech bubble & torch motif representing language & enlightenment -->
  <circle cx="100" cy="85" r="32" fill="#044d3a" stroke="url(#accentGold)" stroke-width="2" />
  
  <!-- Dialogue Icons / Multilingual Waves -->
  <path d="M 85 80 Q 95 72 105 80" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 80 88 Q 95 76 110 88" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 88 96 Q 98 88 108 96" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Lettering: BAULC -->
  <text x="100" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="3">BAULC</text>
  <text x="100" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">LANGUAGE CLUB</text>
  <text x="100" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#9ca3af" text-anchor="middle">ESTD. BAU</text>
</svg>
