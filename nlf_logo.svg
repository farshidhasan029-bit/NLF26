<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nlfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="100" cy="100" r="86" fill="#062e24" stroke="#10b981" stroke-width="2" />

  <!-- Geometric linguistic feather / open book emblem -->
  <!-- Open Book Base -->
  <path d="M 50 120 Q 100 135 150 120 L 145 132 Q 100 145 55 132 Z" fill="url(#goldGrad)" />
  <path d="M 100 70 L 100 130" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left page -->
  <path d="M 100 80 C 80 75 60 82 52 92 C 52 108 52 118 52 118 C 65 110 85 110 100 120 Z" fill="#0f4c3a" stroke="#34d399" stroke-width="1.5"/>
  <!-- Right page -->
  <path d="M 100 80 C 120 75 140 82 148 92 C 148 108 148 118 148 118 C 135 110 115 110 100 120 Z" fill="#0f4c3a" stroke="#34d399" stroke-width="1.5"/>

  <!-- Multilingual glyphs inside emblem -->
  <!-- Bengali 'অ' -->
  <text x="76" y="106" font-family="'Hind Siliguri', sans-serif" font-weight="bold" font-size="22" fill="#fbbf24" text-anchor="middle">অ</text>
  <!-- English 'A' -->
  <text x="124" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="20" fill="#34d399" text-anchor="middle">A</text>

  <!-- Feather Quill rising -->
  <path d="M 100 45 C 95 60 90 70 100 80 C 110 70 105 60 100 45 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="42" r="3" fill="#fef08a"/>

  <!-- Banner text around circle -->
  <text x="100" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" letter-spacing="2.5" text-anchor="middle">NATIONAL LANGUAGE FEST</text>
  <text x="100" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#fbbf24" letter-spacing="4" text-anchor="middle">NLF 2026</text>
  <text x="100" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#6ee7b7" letter-spacing="1" text-anchor="middle">BAU • MYMENSINGH</text>
</svg>
